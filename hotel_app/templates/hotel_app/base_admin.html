{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surya Garden Hotel Admin</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <style>
        /* General body & fonts */
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #333;
            color: white;
            height: 100vh;
            position: fixed;
            padding-top: 20px;
            transition: width 0.3s;
        }
        .sidebar h2 { text-align: center; margin-bottom: 20px; font-size: 18px; }
        .sidebar a {
            display: block;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 15px;
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }
        .sidebar a:hover {
            background: #575757;
            border-left: 4px solid #28a745;
        }

        /* Main content */
        .main { margin-left: 220px; padding: 20px; transition: margin-left 0.3s; }

        /* Cards */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            flex: 1 1 150px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
        }
        .card h3 { margin: 0 0 10px; font-size: 16px; color: #555; }
        .card p { font-size: 18px; font-weight: bold; color: #28a745; margin: 0; }

        /* Buttons */
        .btn {
            background: #28a745;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn:hover { background: #218838; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; border-radius: 8px; overflow: hidden; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: left; font-size: 14px; }
        th { background: #f2f2f2; }
        tr:nth-child(even) { background: #fafafa; }
        tr:hover { background: #f1f1f1; }

        .messages {
    margin: 10px 0;
}

.alert {
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 5px;
}

.alert-success { background-color: #d4edda; color: #155724; }
.alert-warning { background-color: #fff3cd; color: #856404; }
.alert-danger  { background-color: #f8d7da; color: #721c24; }

    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Surya Garden Hotel</h2>
    <a href="{% url 'admin_dashboard' %}">Dashboard</a>
    <a href="{% url 'users' %}">Users</a>
    <a href="{% url 'admin_rooms' %}">Rooms</a>
    <a href="{% url 'admin_bookings' %}">Bookings</a>
    <a href="{% url 'admin_feedbacks' %}">Feedbacks</a>
    <a href="{% url 'admin_bills' %}">Bills</a>
    <a href="{% url 'admin_payments' %}">Payments</a>
    <a href="{% url 'logout' %}">Logout</a>
</div>

<!-- Main Content -->
<div class="main">

    {% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}

    {% block content %}
    <!-- Dynamic content for each page will load here -->
    {% endblock %}
</div>

</body>
</html>
